<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modélisation de l'apprentissage arithmétique</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  </head>
  <body>
    <main>
        <div id="top">
            <h1 class="text-center">Modélisation de l'apprentissage arithmétique</h1>
            <div id="tables">
                <div class="p-3 d-flex flex-row justify-content-around">
                    <div id="equation" class="w-25">
                        <button type="button" class="btn btn-outline-primary">Importer les équations</button>
                        <div> Aperçu des équations :</div>
                        <table class="table table-striped table-bordered">
                            <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Augend</th>
                                    <th scope="col">Addend</th>
                                    <th scope="col">Résultat</th>
                                </tr>
                            </thead>
                            <tbody id="equation-table" class="table-group-divider">
                                <!-- Les lignes d'équations seront ajoutées ici dynamiquement -->
                            </tbody>
                        </table>
                    </div>
                    <div id="data" class="w-25">
                        <button type="button" class="btn btn-outline-primary">Importer les données existantes</button>
                        <div> Aperçu de vos données :</div>
                        <table class="table table-striped table-bordered">
                            <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Augend</th>
                                    <th scope="col">Addend</th>
                                    <th scope="col">Résultat</th>
                                    <th scope="col">Temps</th>
                                    <th scope="col">Session</th>
                                </tr>
                            </thead>
                            <tbody id="data-table" class="table-group-divider">

                                <!-- Les lignes d'équations seront ajoutées ici dynamiquement -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div id="parameters">
                <form>
                    <div id="initialisation" class="d-flex flex-column">
                        <div class="ms-5">Veuillez modifier les paramètres d'initialisation :</div>
                        <div class="d-flex flex-row justify-content-around">
                            <div class="m-3">
                                <label for="encoding-time" class="form-label">Temps d'encodage par élément (ms)</label>
                                <input type="number" class="form-control" id="encoding-time" value="80">
                            </div>
                            <div class="m-3">
                                <label for="comparaison-time" class="form-label">Temps de comparaison (ms)</label>
                                <input type="number" class="form-control" id="comparaison-time" value="200">
                            </div>
                            <div class="m-3">
                                <label for="command-time" class="form-label">Temps de commande moteur (ms)</label>
                                <input type="number" class="form-control" id="command-time" value="300">
                            </div>
                            <div class="m-3">
                                <label for="error-rate" class="form-label">Taux d'erreur (%)</label>
                                <input type="number" class="form-control" id="error-rate" value="5">
                            </div>
                        </div>
                    </div>
                    <div id="estimation">
                        <div>Veuillez modifier les paramètres à estimer :</div>
                        <div class="mb-3">
                            <label for="alpha-time" class="form-label">α : Temps de calcul entre chaque lettre (ms)</label>
                            <input type="number" class="form-control" id="alpha-time" value="20">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
  </body>
</html>
